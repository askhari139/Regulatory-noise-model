# PILOT 2: production settings, TT, Additive + Multiplicative + LogAdditive, 100 sets per class,
# with per-replicate summaries and windowed fold-change.
# Every number used by the pipeline lives here. Do not edit after a run starts:
# the SHA-256 of everything except [paths] is stamped into every output file.

[run]
run_id = "pilot2-2026-10"
seed_root = 20261018
networks = ["TT"]
noise_modes = ["Additive", "Multiplicative", "LogAdditive"]

[paths]
# Machine-specific; excluded from config_hash. Override with --data-dir / --results-root.
data_dir = "inputs"
results_root = "results"

[selection]
n_per_class = 100
classes = ["monostable", "bistable", "tristable"]

[model]
lambda_inh_bounds = [0.01, 1.0]
lambda_act_bounds = [1.0, 100.0]

[noise]
sigmas = [0.0, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]
dts = [0.01, 1.0, 10.0]

[sim]
t_end = 1000.0
t_burn = 500.0
saveat = 1.0
reltol = 1e-4
abstol = 1e-5
n_ics = 100
n_traj = 100
n_blocks = 5
threshold_multipliers = [0.5, 2.0]

[controls]
modes = ["Additive", "Multiplicative", "LogAdditive"]
n_det_draws = 1000
convergence_ns = [10, 30, 100, 300, 1000]
n_bootstrap = 200
ctrl_sigmas = [0.01, 0.1, 1.0]
hold_times = [0.01, 0.1, 1.0, 10.0, 100.0]
pool_dt = 0.01
acf_lags = [1, 5, 10, 50]
lambda_quantiles = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]

[observables]
# Per-replicate summaries: first replicates_stored replicates of every condition cell.
replicates_stored = 100
# Windowed log fold-change (C1, C3): fraction of time points with |log2 x(t+lag) - log2 x(t)| >= threshold.
lfc_lags = [1.0, 3.0, 10.0, 30.0, 100.0]
lfc_log2_thresholds = [1.0, 2.0]

